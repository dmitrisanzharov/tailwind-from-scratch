<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dmitri Food App, from Net Ninja</title>
        <link href="styles.css" rel="stylesheet" />
    </head>
    <body>
        <h1 class="text-3xl">Fonts and Colors</h1>
        <ul class="list-disc list-inside">
            <li class="text-red-700">red</li>
            <li class="text-blue-800 font-bold">blue bold</li>
            <li class="text-yellow-600 font-light">yellow light</li>
        </ul>

        <div class="py-3">
            <hr />
        </div>

        <h1 class="text-3xl">Padding & margins & borders</h1>
        <ul class="">
            <li class="pl-2" style="background-color: lightgray; width: fit-content; border: 1px solid">
                padding 2 left
            </li>
            <li class="mt-4 ml-4" style="background-color: lightgray; width: fit-content; border: 1px solid">
                margin left and top 4
            </li>
            <li class="mt-4 ml-4 p-2" style="background-color: lightgray; width: fit-content; border: 1px solid">
                margin left and top 4 and padding 2
            </li>
            <li class="border-5 border-blue-900 mt-4" style="background-color: lightgray">border</li>
            <li class="border-b-5 border-yellow-900 mt-4" style="background-color: lightgray">border</li>
            <li class="border border-green-500 mt-4" style="background-color: lightgray">border</li>
        </ul>

        <div class="text-massive">foo</div>
    </body>
